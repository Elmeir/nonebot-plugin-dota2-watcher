[project]
name = "nonebot-plugin-dota2-watcher"
version = "2.0.0"
description = "DOTA2 观察者 NoneBot2 插件：DOTA2 开黑战报 / 新闻推送 / TI 赛事 / D2PT 出装"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Elmeir", email = "" },
]
keywords = ["nonebot", "nonebot2", "dota2", "steam", "opendota", "d2pt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: NoneBot",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "nonebot-plugin-localstore>=0.7.4",
    "httpx>=0.24.0",
    "Pillow>=9.0.0",
    "fonttools>=4.0.0",
    "playwright>=1.30.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Elmeir/nonebot-plugin-dota2-watcher"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.nonebot]
plugins = ["nonebot_plugin_dota2_watcher", "nonebot_plugin_localstore"]

[tool.setuptools]
packages = [
    "nonebot_plugin_dota2_watcher",
    "nonebot_plugin_dota2_watcher.handlers",
    "nonebot_plugin_dota2_watcher.services",
    "nonebot_plugin_dota2_watcher.datasources",
    "nonebot_plugin_dota2_watcher.generators",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 默认规则 E4/E7/E9/F，加上 import 排序(I)与 pyupgrade 现代化(UP)。
# 刻意不启用 N(命名)，避免破坏 player_info.json 等持久化字段名。
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
